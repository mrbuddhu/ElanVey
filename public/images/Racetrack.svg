<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="48" viewBox="0 0 1200 48" preserveAspectRatio="none">
  <defs>
    <pattern id="checkerboard" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="24" height="24" fill="#000000" />
      <rect x="24" y="0" width="24" height="24" fill="#FFFFFF" />
      <rect x="0" y="24" width="24" height="24" fill="#FFFFFF" />
      <rect x="24" y="24" width="24" height="24" fill="#000000" />
    </pattern>
  </defs>
  <rect width="100%" height="48" fill="url(#checkerboard)" />
  <line x1="0" y1="0" x2="100%" y2="0" stroke="#000000" stroke-width="2" />
  <line x1="0" y1="48" x2="100%" y2="48" stroke="#000000" stroke-width="2" />
</svg>
